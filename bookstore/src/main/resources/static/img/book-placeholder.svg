<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <!-- Background -->
  <rect width="200" height="300" fill="#f0f0f0"/>
  
  <!-- Book spine -->
  <rect x="10" y="20" width="180" height="260" fill="#e8e8e8" stroke="#999" stroke-width="2"/>
  
  <!-- Book pages effect -->
  <line x1="10" y1="40" x2="190" y2="40" stroke="#ddd" stroke-width="1"/>
  <line x1="10" y1="60" x2="190" y2="60" stroke="#ddd" stroke-width="1"/>
  <line x1="10" y1="80" x2="190" y2="80" stroke="#ddd" stroke-width="1"/>
  
  <!-- Book icon -->
  <g transform="translate(50, 80)">
    <path d="M 30 10 L 50 20 L 50 70 L 30 60 L 10 70 L 10 20 Z" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
    <line x1="30" y1="10" x2="30" y2="60" stroke="#2980b9" stroke-width="1"/>
  </g>
  
  <!-- Text placeholder -->
  <rect x="30" y="150" width="140" height="6" fill="#ccc" rx="3"/>
  <rect x="30" y="165" width="140" height="5" fill="#ddd" rx="2"/>
  <rect x="30" y="177" width="100" height="5" fill="#ddd" rx="2"/>
</svg>