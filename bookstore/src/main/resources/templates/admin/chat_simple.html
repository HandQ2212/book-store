<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/chat_admin.css}">
</head>
<body>
<!-- Chat Button -->
<button class="chat-button" id="chatButton">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
    </svg>
    <span class="chat-badge" id="chatBadge">0</span>
</button>

<!-- Chat Window -->
<div class="chat-window" id="chatWindow">
    <div class="chat-header">
        <h3>Chat với Users</h3>
        <button class="chat-close" id="chatClose">&times;</button>
    </div>
    <div class="chat-body">
        <div class="user-list" id="userList">
            <div class="empty-user-list">Chưa có tin nhắn từ user nào</div>
        </div>
        <div class="chat-area">
            <div class="chat-messages" id="chatMessages">
                <div class="empty-chat">Chọn một user để bắt đầu trò chuyện</div>
            </div>
            <div class="chat-input-container">
                <input type="text" class="chat-input" id="chatInput" placeholder="Nhập tin nhắn..." disabled>
                <button class="chat-send-btn" id="chatSend" disabled>Gửi</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/chat_admin.js}"></script>
<script th:inline="javascript">
    const userId = /*[[${user != null ? user.id : null}]]*/ null;
    if (userId) {
        initChat(userId);
    }
</script>
</body>
</html>
