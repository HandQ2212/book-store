<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>Insert title here</title>
</head>
<body>
<section>
  <div class="container mt-5 mb-5">
    <div class="row">
      <div class="col-lg-8 offset-lg-2">
        <div class="card shadow-md">
          <div class="card-header bg-gradient-primary">
            <h5 class="mb-0"><i class="fas fa-user-circle me-2"></i>My Profile</h5>
          </div>
          <div class="card-body">
            <!-- Messages -->
            <th:block th:if="${session.succMsg}">
              <div class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle me-2"></i>[[${session.succMsg}]]
                <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
              </div>
            </th:block>

            <th:block th:if="${session.errorMsg}">
              <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>[[${session.errorMsg}]]
                <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
              </div>
            </th:block>

            <!-- Profile Image -->
            <div class="text-center mb-4">
              <img alt="Profile" th:src="@{'../img/profile_img/'+${user.profileImage}}"
                   class="rounded-circle border-3"
                   style="width: 120px; height: 120px; object-fit: cover; border: 4px solid var(--secondary-color);">
            </div>

            <!-- Form -->
            <form action="/admin/update-profile" method="post" enctype="multipart/form-data">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-600"><i class="fas fa-user text-secondary me-2"></i>Name</label>
                  <input type="text" name="name" class="form-control" th:value="${user.name}">
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-600"><i class="fas fa-phone text-secondary me-2"></i>Mobile Number</label>
                  <input type="text" name="mobileNumber" class="form-control" th:value="${user.mobileNumber}">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-600"><i class="fas fa-envelope text-secondary me-2"></i>Email</label>
                <input type="email" name="email" class="form-control" readonly th:value="${user.email}">
              </div>

              <div class="mb-3">
                <label class="form-label fw-600"><i class="fas fa-map-marker-alt text-secondary me-2"></i>Address</label>
                <input type="text" name="address" class="form-control" th:value="${user.address}">
              </div>

              <div class="row">
                <div class="col-md-4 mb-3">
                  <label class="form-label fw-600"><i class="fas fa-city text-secondary me-2"></i>City</label>
                  <input type="text" name="city" class="form-control" th:value="${user.city}">
                </div>
                <div class="col-md-4 mb-3">
                  <label class="form-label fw-600"><i class="fas fa-map text-secondary me-2"></i>State</label>
                  <input type="text" name="state" class="form-control" th:value="${user.state}">
                </div>
                <div class="col-md-4 mb-3">
                  <label class="form-label fw-600"><i class="fas fa-mailbox text-secondary me-2"></i>Pincode</label>
                  <input type="text" name="pincode" class="form-control" th:value="${user.pincode}">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-600"><i class="fas fa-image text-secondary me-2"></i>Profile Image</label>
                <input type="file" name="img" class="form-control">
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-600"><i class="fas fa-user-tag text-secondary me-2"></i>Role</label>
                  <input type="text" name="role" class="form-control" readonly th:value="${user.role}">
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-600"><i class="fas fa-check-circle text-secondary me-2"></i>Account Status</label>
                  <input type="text" name="status" class="form-control" readonly th:value="${user.isEnable}">
                  <input type="hidden" th:value="${user.id}" name="id">
                </div>
              </div>

              <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save me-2"></i>Update Profile</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Change Password Card -->
    <div class="row mt-5">
      <div class="col-lg-6 offset-lg-3">
        <div class="card shadow-md">
          <div class="card-header bg-gradient-secondary">
            <h5 class="mb-0"><i class="fas fa-lock me-2"></i>Change Password</h5>
          </div>
          <div class="card-body">
            <form action="/admin/change-password" method="post">
              <div class="mb-3">
                <label class="form-label fw-600"><i class="fas fa-lock-open text-secondary me-2"></i>Current Password</label>
                <input type="password" name="currentPassword" class="form-control" required>
              </div>

              <div class="mb-3">
                <label class="form-label fw-600"><i class="fas fa-key text-secondary me-2"></i>New Password</label>
                <input type="password" name="newPassword" class="form-control" required>
              </div>

              <div class="mb-3">
                <label class="form-label fw-600"><i class="fas fa-key text-secondary me-2"></i>Confirm Password</label>
                <input type="password" name="confirmPassword" class="form-control" required>
              </div>

              <div class="text-center mt-4">
                <button type="submit" class="btn btn-secondary btn-lg"><i class="fas fa-edit me-2"></i>Change Password</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
