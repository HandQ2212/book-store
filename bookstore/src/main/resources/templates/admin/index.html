<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
</head>
<body>
<section>
    <div class="container mt-5 p-5">
        <div class="section-header">
            <h2><i class="fa-solid fa-sliders"></i> Admin Dashboard</h2>
        </div>
        <div class="row">
            <div class="col-md-6 mb-4">
                <a href="/admin/loadAddBook" class="text-decoration-none">
                    <div class="card h-100">
                        <div class="card-body text-center">
                            <i class="fa-solid fa-square-plus fa-3x" style="color: var(--secondary-color);"></i>
                            <h4 class="mt-3 mb-2">Add Book</h4>
                            <p class="text-muted">Add new books to inventory</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 mb-4">
                <a href="/admin/category" class="text-decoration-none">
                    <div class="card h-100">
                        <div class="card-body text-center">
                            <i class="fa-solid fa-list fa-3x" style="color: var(--accent-color);"></i>
                            <h4 class="mt-3 mb-2">Manage Categories</h4>
                            <p class="text-muted">Add or edit categories</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 mb-4">
                <a href="/admin/books" class="text-decoration-none">
                    <div class="card h-100">
                        <div class="card-body text-center">
                            <i class="fa-solid fa-table-list fa-3x" style="color: var(--success-color);"></i>
                            <h4 class="mt-3 mb-2">View Books</h4>
                            <p class="text-muted">Manage all books</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 mb-4">
                <a href="/admin/orders" class="text-decoration-none">
                    <div class="card h-100">
                        <div class="card-body text-center">
                            <i class="fa-solid fa-box-open fa-3x" style="color: var(--accent-color);"></i>
                            <h4 class="mt-3 mb-2">Orders</h4>
                            <p class="text-muted">Track customer orders</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 mb-4">
                <a href="/admin/users?type=1" class="text-decoration-none">
                    <div class="card h-100">
                        <div class="card-body text-center">
                            <i class="fa-solid fa-users fa-3x" style="color: var(--primary-color);"></i>
                            <h4 class="mt-3 mb-2">Users</h4>
                            <p class="text-muted">Manage user accounts</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 mb-4">
                <a href="/admin/add-admin" class="text-decoration-none">
                    <div class="card h-100">
                        <div class="card-body text-center">
                            <i class="fa-solid fa-user-tie fa-3x" style="color: var(--secondary-color);"></i>
                            <h4 class="mt-3 mb-2">Add Admin</h4>
                            <p class="text-muted">Create new admin account</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
