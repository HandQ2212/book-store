<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Book Store</title>
</head>
<body>
<section>
    <div class="container mt-5 p-5">
        <div class="row">
            <p class="text-center fs-3">My Orders</p>
            <th:block th:if="${session.succMsg}">
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle"></i> [[${session.succMsg}]]
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
            </th:block>

            <th:block th:if="${session.errorMsg}">
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle"></i> [[${session.errorMsg}]]
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
            </th:block>
            <div class="col-md-12 ">

                <table class="table table-bordered card-sh">
                    <thead >
                    <tr >
                        <th scope="col">Order Id</th>
                        <th scope="col">Date</th>
                        <th scope="col">Book Details</th>
                        <th scope="col">Price</th>
                        <th scope="col">Status</th>
                        <th scope="col">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="o:${orders}">
                        <th scope="row">[[${o.orderId}]]</th>
                        <td>[[${o.orderDate}]]</td>
                        <td>[[${o.book.title}]]</td>
                        <td>Quantity : [[${o.quantity}]] <br>Price :
                            [[${o.price}]] <br>Total Price :[[${o.quantity *
                            o.price}]]
                        </td>
                        <td>[[${o.status}]]</td>
                        <td><th:block th:if="${o.status!='Cancelled'}">
                            <a th:href="@{'/user/update-status?id='+${o.id}+'&st=6' }"
                               class="btn btn-sm btn-danger">Cancel</a>
                        </th:block> <th:block th:unless="${o.status!='Cancelled'}">
                            <a href="#" class="btn btn-sm btn-danger disabled" >Cancel</a>
                        </th:block></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</section>
</body>
</html>
