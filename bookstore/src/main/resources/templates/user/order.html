<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Book Store</title>
</head>
<body>
<section>

    <div class="container mt-5 p-5">
        <form action="/user/save-order" method="post" id="orders" accept-charset="UTF-8" novalidate>
            <div class="row">

                <div class="col-md-6">


                    <div class="mb-3 row">
                        <p class="text-center fs-4">Billing Address</p>
                        <hr>
                        <div class="col-12 p-1">
                            <label>Name</label> <input type="text" name="firstName" required
                                                       class="form-control mt-1" th:value="${user.name}" placeholder="Nguyễn Văn A">
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <div class="col p-1">
                            <label>Email</label> <input type="email" name="email" required
                                                        class="form-control col" th:value="${user.email}">
                        </div>
                        <div class="col p-1">
                            <label>Mobile Number</label> <input type="text" name="mobileNo" required
                                                                class="form-control col ms-2" th:value="${user.mobileNumber}">
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <div class="col p-1">
                            <label>Address</label> <input type="text" name="address" required
                                                          class="form-control col" th:value="${user.address}">
                        </div>
                        <div class="col p-1">
                            <label>City</label> <input type="text" name="city" required
                                                       class="form-control col ms-2" th:value="${user.city}" placeholder="Hà Nội, TP Hồ Chí Minh...">
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <div class="col p-1">
                            <label>Quốc Gia</label> <input type="text" name="state" required
                                                        class="form-control col" th:value="${user.state}" placeholder="Việt Nam">
                        </div>
                        <div class="col p-1">
                            <label>Pincode</label> <input type="text" name="pincode" required
                                                          class="form-control col ms-2" th:value="${user.pincode}" placeholder="Nhập mã bưu điện">
                        </div>
                    </div>
                    <!-- </form> -->

                </div>
                <div class="col-md-6">
                    <p class="text-center fs-4">Payment Type</p>
                    <hr>
                    <div class="card">
                        <div class="card-body">
                            <table class="table table-borderless">
                                <tbody>
                                <tr>
                                    <td>Subtotal</td>
                                    <td>:</td>
                                    <td>[[${@commonUtil.formatPrice(orderPrice)}]]<th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block></td>
                                </tr>
                                <tr>
                                    <td>Delivery Fee</td>
                                    <td>:</td>
                                    <td>[[${@commonUtil.formatPrice(deliveryFee)}]]<th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block></td>
                                </tr>

                                <tr>
                                    <td>Tax (5%)</td>
                                    <td>:</td>
                                    <td>[[${@commonUtil.formatPrice(tax)}]]<th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block></td>
                                </tr>

                                <tr class="border-top">
                                    <td><strong>Total Payment</strong></td>
                                    <td>:</td>
                                    <td><strong>[[${@commonUtil.formatPrice(totalOrderPrice)}]]<th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block></strong></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="card shadow p-3 mb-5 mt-2 bg-body-tertiary rounded">

                        <div class="card-body">
                            <!-- <form action="/login" method="post"> -->
                            <div class="mb-3">
                                <label class="form-label">Payment Type</label>
                                <input type="text" name="paymentType" class="form-control" value="Cash On Delivery" readonly style="background-color: #e9ecef; cursor: not-allowed;">
                            </div>

                            <button class="btn bg-primary text-white col-md-12">Place
                                Order</button>

                        </div>
                    </div>
                </div>

            </div>
        </form>
    </div>

</section>
</body>
</html>
