<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
</head>
<body>
<section>

    <div class="container mt-5 p-5">
        <form action="/user/save-order" method="post" id="orders" novalidate accept-charset="UTF-8">
            <div class="row">

                <div class="col-md-6">

                    <p class="text-center fs-4">Billing Address</p>
                    <hr>
                    <div class="mb-3 row">
                        <div class="col p-1">
                            <label>Name</label> 
                            <input type="text" name="firstName" th:value="${user.name}"
                                   class="form-control mt-1" readonly>
                            <input type="hidden" name="firstName" th:value="${user.name}">
                        </div>
                        <div class="col p-1">
                            <label>Email</label> 
                            <input type="email" name="email" th:value="${user.email}"
                                   class="form-control col" readonly>
                            <input type="hidden" name="email" th:value="${user.email}">
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <div class="col p-1">
                            <label>Mobile Number</label> 
                            <input type="text" name="mobileNo" th:value="${user.mobileNumber}"
                                   class="form-control col" readonly>
                            <input type="hidden" name="mobileNo" th:value="${user.mobileNumber}">
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <div class="col p-1">
                            <label>Address</label> 
                            <input type="text" name="address" th:value="${user.address}"
                                   class="form-control col">
                        </div>
                        <div class="col p-1">
                            <label>City</label> 
                            <input type="text" name="city" th:value="${user.city}"
                                   class="form-control col ms-2">
                        </div>
                    </div>
                    <!-- </form> -->

                </div>
                <div class="col-md-6">
                    <p class="text-center fs-4">Payment Type</p>
                    <hr>
                    <div class="card">
                        <div class="card-body">
                            <table class="table table-borderless">
                                <tbody>
                                <tr>
                                    <td>Total price</td>
                                    <td>:</td>
                                    <td><th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block> [[${orderPrice}]]</td>
                                </tr>
                                <tr>
                                    <td>Delivery Fee</td>
                                    <td>:</td>
                                    <td><th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block> 250</td>
                                </tr>

                                <tr>
                                    <td>Tax</td>
                                    <td>:</td>
                                    <td><th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block> 100</td>
                                </tr>

                                <tr class="border-top">
                                    <td>Total Price</td>
                                    <td>:</td>
                                    <td><th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block> [[${totalOrderPrice}]]</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="card shadow p-3 mb-5 mt-2 bg-body-tertiary rounded">

                        <div class="card-body">
                            <!-- <form action="/login" method="post"> -->
                            <div class="mb-3">
                                <label class="form-label">Select Payment Type</label> <select required
                                                                                              name="paymentType" class="form-control">
                                <option value="">--select--</option>
                                <option value="COD">Cash On Delivery</option>
                                <option value="ONLINE">Online Payment</option>
                            </select>

                            </div>

                            <button class="btn bg-primary text-white col-md-12">Place
                                Order</button>

                        </div>
                    </div>
                </div>

            </div>
        </form>
    </div>

</section>
</body>
</html>
