<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>Insert title here</title>
</head>
<body>
<section>
  <div class="container mt-5 mb-5">
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header text-center">
            <h2><i class="fa-solid fa-shopping-cart"></i> Shopping Cart</h2>
          </div>
          <th:block th:if="${session.succMsg}">
            <div class="alert alert-success m-3" role="alert">
              <i class="fa-solid fa-check-circle"></i> [[${session.succMsg}]]
            </div>
            <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
          </th:block>
          <th:block th:if="${session.errorMsg}">
            <div class="alert alert-danger m-3" role="alert">
              <i class="fa-solid fa-circle-exclamation"></i> [[${session.errorMsg}]]
            </div>
            <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
          </th:block>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col">#</th>
                    <th scope="col">Book</th>
                    <th scope="col">Price</th>
                    <th scope="col" class="text-center">Quantity</th>
                    <th scope="col" class="text-end">Total</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="cart,c:${carts}">
                    <th scope="row">[[${c.count}]]</th>
                    <td>
                      <div class="d-flex align-items-center">
                        <img th:src="@{'/img/book_img/'+${cart.book.image}}" th:alt="${cart.book.title}" style="width: 50px; height: 50px; object-fit: cover; margin-right: 1rem; border-radius: 6px;">
                        <span th:text="${cart.book.title}"></span>
                      </div>
                    </td>
                    <td><strong><th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block> [[${cart.book.discountPrice}]]</strong></td>
                    <td class="text-center">
                      <a th:href="@{'/user/cartQuantityUpdate?sy=de&cid='+${cart.id}}" class="btn btn-sm btn-outline" title="Decrease">
                        <i class="fa-solid fa-minus"></i>
                      </a>
                      <span class="mx-2">[[${cart.quantity}]]</span>
                      <a th:href="@{'/user/cartQuantityUpdate?sy=in&cid='+${cart.id}}" class="btn btn-sm btn-outline" title="Increase">
                        <i class="fa-solid fa-plus"></i>
                      </a>
                    </td>
                    <td class="text-end"><strong><th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block> [[${cart.totalPrice}]]</strong></td>
                  </tr>
                  <tr style="background-color: var(--light-bg);">
                    <td colspan="4" class="text-end fw-bold">Total Amount:</td>
                    <td class="text-end fw-bold text-primary" style="font-size: 1.25rem;">
                      <th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block> [[${totalOrderPrice}]]
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="text-center mt-4">
              <a href="/user/orders" class="btn btn-primary btn-lg">
                <i class="fa-solid fa-credit-card"></i> Proceed to Checkout
              </a>
              <a href="/books" class="btn btn-outline ms-2">
                <i class="fa-solid fa-arrow-left"></i> Continue Shopping
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</section>
</body>
</html>
