<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <title>Book Store</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/favicon.png" th:href="@{/favicon.png}">
</head>
<body style="padding-top: 80px; display: flex; flex-direction: column; min-height: 100vh;">
<!-- Start Navbar  -->
<nav class="navbar navbar-expand-lg fixed-top navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/"><i
                class="fa-solid fa-book"></i> Book Store</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <th:block th:if="${user==null}">
                    <li class="nav-item"><a class="nav-link active"
                                            aria-current="page" href="/"><i class="fa-solid fa-house"></i>
                        Home</a></li>
                </th:block>

                <th:block th:unless="${user==null}">
                    <li class="nav-item" th:if="${user.role=='ROLE_ADMIN'}"><a
                            class="nav-link active" aria-current="page" href="/admin/"><i
                            class="fa-solid fa-house"></i> Home</a></li>

                    <li class="nav-item" th:if="${user.role=='ROLE_USER'}"><a
                            class="nav-link active" aria-current="page" href="/"><i
                            class="fa-solid fa-house"></i> Home</a></li>
                </th:block>



                <li class="nav-item"><a class="nav-link active"
                                        aria-current="page" href="/books">Book</a></li>

                <li class="nav-item dropdown"><a
                        class="nav-link dropdown-toggle" href="#" role="button"
                        data-bs-toggle="dropdown" aria-expanded="false"> Category </a>
                    <ul class="dropdown-menu">
                        <li th:each="c:${categorys}"><a class="dropdown-item"
                                                        th:href="@{'/books?category='+${c.name}}">[[${c.name}]]</a></li>

                    </ul></li>

            </ul>

            <!-- Search Bar -->
            <div class="position-relative mx-auto" style="width: 400px;">
                <form action="/books" method="get" class="d-flex" role="search" id="searchForm">
                    <input type="text" class="form-control me-2" name="ch" id="searchInput" placeholder="Search books..." autocomplete="off">
                    <button class="btn btn-outline-light" type="submit">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </form>
                <div id="searchSuggestions" class="position-absolute w-100 bg-white border rounded shadow-lg" style="display: none; max-height: 400px; overflow-y: auto; z-index: 1000; top: 100%; margin-top: 5px;"></div>
            </div>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <th:block th:if="${user==null}">
                    <li class="nav-item"><a class="nav-link active"
                                            aria-current="page" href="/signin"><i
                            class="fa-solid fa-right-to-bracket"></i> LOGIN</a></li>
                    <li class="nav-item"><a class="nav-link active"
                                            aria-current="page" href="/register">REGISTER</a></li>


                </th:block>

                <th:block th:if="${user!=null}">
                    <th:block th:if="${user.role=='ROLE_USER'}">
                        <li class="nav-item"><a class="nav-link active"
                                                aria-current="page" href="/user/cart"><i
                                class="fa-solid fa-cart-shopping"></i> Cart [ [[${countCart}]]
                            ]</a></li>
                    </th:block>
                    <li class="nav-item dropdown"><a
                            class="nav-link dropdown-toggle active" href="#" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false"> <i
                            class="fa-solid fa-user"></i> [[${user.name}]]
                    </a>
                        <ul class="dropdown-menu">
                            <li th:if="${user.role=='ROLE_USER'}"><a
                                    class="dropdown-item" href="/user/profile">Profile</a></li>

                            <li th:if="${user.role=='ROLE_ADMIN'}"><a
                                    class="dropdown-item" href="/admin/profile">Profile</a></li>

                            <li th:if="${user.role=='ROLE_USER'}"><a
                                    class="dropdown-item" href="/user/user-orders">My Orders</a></li>
                            <li><a class="dropdown-item" href="/logout">Logout</a></li>
                            <li><hr class="dropdown-divider"></li>

                        </ul></li>

                    <!-- <li class="nav-item"><a class="nav-link active"
                        aria-current="page" href="/logout"><i
                            class="fa-solid fa-right-to-bracket"></i> Logout</a></li> -->
                </th:block>

            </ul>

        </div>
    </div>
</nav>
<!-- End Navbar -->

<div th:replace="${content}" style="flex: 1;"></div>

<!-- Chat Widget -->
<th:block th:if="${user!=null}">
    <th:block th:if="${user.role=='ROLE_USER'}">
        <div th:insert="~{user/chat_simple}"></div>
    </th:block>
    <th:block th:if="${user.role=='ROLE_ADMIN'}">
        <div th:insert="~{admin/chat_simple}"></div>
    </th:block>
</th:block>

<!-- Start Footer -->
<footer>
    <div class="container-fluid">
        <p>&copy; 2025 Book Store. All rights reserved.</p>
    </div>
</footer>
<!-- End Footer  -->

<!-- Jquery Validation Library  -->
<script
        src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script
        src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.js"></script>
<script type="text/javascript" src="js/script.js"></script>
<script type="text/javascript" src="../js/script.js"></script>
<!-- End  -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

<!-- Search Autocomplete Script -->
<script>
    $(document).ready(function() {
        let searchTimeout;
        const searchInput = $('#searchInput');
        const searchSuggestions = $('#searchSuggestions');

        // Handle input event with debouncing
        searchInput.on('input', function() {
            clearTimeout(searchTimeout);
            const query = $(this).val().trim();

            if (query.length < 2) {
                searchSuggestions.hide().empty();
                return;
            }

            searchTimeout = setTimeout(function() {
                $.ajax({
                    url: '/api/search-suggestions',
                    method: 'GET',
                    data: { query: query },
                    success: function(books) {
                        displaySuggestions(books);
                    },
                    error: function() {
                        searchSuggestions.hide().empty();
                    }
                });
            }, 300);
        });

        function displaySuggestions(books) {
            searchSuggestions.empty();

            if (books.length === 0) {
                searchSuggestions.html('<div class="p-3 text-muted">No books found</div>');
                searchSuggestions.show();
                return;
            }

            books.forEach(function(book) {
                const discountPrice = book.discountPrice || book.price;
                const formattedPrice = Number(book.price).toLocaleString('vi-VN');
                const formattedDiscountPrice = Number(discountPrice).toLocaleString('vi-VN');
                const priceDisplay = book.discount > 0
                    ? `<span class="text-decoration-line-through text-muted">${formattedPrice}đ</span> <span class="text-danger fw-bold">${formattedDiscountPrice}đ</span>`
                    : `<span class="fw-bold">${formattedPrice}đ</span>`;

                const suggestionItem = $('<a>')
                    .attr('href', '/book/' + book.id)
                    .addClass('d-flex align-items-center p-2 text-decoration-none text-dark border-bottom suggestion-item')
                    .css('cursor', 'pointer')
                    .html(`
                        <img src="${book.image}" alt="${book.title}" class="me-3" style="width: 50px; height: 70px; object-fit: cover;">
                        <div class="flex-grow-1">
                            <div class="fw-semibold">${book.title}</div>
                            <div class="small text-muted">${book.category}</div>
                            <div class="small">${priceDisplay}</div>
                        </div>
                    `);

                suggestionItem.hover(
                    function() { $(this).css('background-color', '#f8f9fa'); },
                    function() { $(this).css('background-color', 'white'); }
                );

                searchSuggestions.append(suggestionItem);
            });

            searchSuggestions.show();
        }

        // Hide suggestions when clicking outside
        $(document).on('click', function(event) {
            if (!$(event.target).closest('#searchInput, #searchSuggestions').length) {
                searchSuggestions.hide();
            }
        });

        // Show suggestions again when focusing on input if there's text
        searchInput.on('focus', function() {
            if ($(this).val().trim().length >= 2 && searchSuggestions.children().length > 0) {
                searchSuggestions.show();
            }
        });

        // Handle form submission
        $('#searchForm').on('submit', function() {
            searchSuggestions.hide();
        });
    });
</script>

</body>
</html>
