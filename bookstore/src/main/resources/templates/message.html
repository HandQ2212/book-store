<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Message - Book Store</title>
</head>
<body>
<section>
    <div class="container mt-5 p-5">
        <div class="row">
            <div class="col-md-8 p-5 offset-md-2 text-center">
                <div class="card shadow p-5 rounded">
                    <div class="mb-4">
                        <i class="fas fa-info-circle fa-3x text-primary"></i>
                    </div>
                    <h3 class="fw-bold text-dark">[[${msg}]]</h3>
                    <p class="text-muted mt-3">Please check your email for further instructions.</p>
                    <a href="/login" class="btn btn-primary mt-3"><i class="fas fa-arrow-left"></i> Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
