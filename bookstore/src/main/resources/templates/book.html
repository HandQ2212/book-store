<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Bookstore - Browse Books</title>
</head>
<body>
<section>

    <div class="container-fluid mt-3">
        <div class="row">

            <div class="col-md-2 p-0 pe-3">

                <div class="card category-sidebar">
                    <div class="card-body">
                        <div class="list-group">
                            <h5 class="category-title mb-3">
                                <i class="fas fa-list me-2"></i>Category
                            </h5>
                            <a href="/books"
                               th:classappend="${paramValue==''} ? 'active':''"
                               class="list-group-item list-group-item-action category-item"
                               aria-current="true">
                                <i class="fas fa-th-large me-2"></i>All
                            </a>
                            <a th:each="c:${categories}"
                               th:href="@{'/books?category='+${c.name}}"
                               th:classappend="${paramValue == c.name} ? 'active':''"
                               class="list-group-item list-group-item-action category-item">
                                <i class="fas fa-book me-2"></i>[[${c.name}]]
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-10">
                <div class="card books-container">
                    <div class="card-body">
                        <h2 class="books-header text-center mb-4">
                            <i class="fas fa-book-open me-2"></i>Books
                        </h2>
                        <div class="row">

                            <th:block th:if="${booksSize >0}">
                                <div class="col-md-3 mt-3 mb-3" th:each="p:${books}">
                                    <div class="card book-card h-100">
                                        <!-- Discount Badge - Top Right Corner -->
                                        <th:block th:if="${p.discount > 0}">
                                            <span class="discount-badge-corner">[[${p.discount}]]% OFF</span>
                                        </th:block>

                                        <div class="card-body d-flex flex-column text-center p-3">
                                            <div class="book-image-container mb-3">
                                                <img alt="" th:src="${@commonUtil.getImageUrl(p.image)}"
                                                     class="book-image">
                                            </div>
                                            <h5 class="book-title mb-2">[[${p.title}]]</h5>
                                            <div class="mt-auto">
                                                <div class="price-section mb-3">
                                                    <!-- Nếu có giảm giá thì hiển thị giá giảm và giá gốc -->
                                                    <th:block th:if="${p.discount > 0}">
                                                        <div class="current-price">
                                                            [[${@commonUtil.formatPrice(p.discountPrice)}]]đ
                                                        </div>
                                                        <div>
                                                            <span class="original-price">[[${@commonUtil.formatPrice(p.price)}]]đ</span>
                                                        </div>
                                                    </th:block>

                                                    <!-- Nếu không giảm giá thì chỉ hiển thị giá gốc -->
                                                    <th:block th:unless="${p.discount > 0}">
                                                        <div class="current-price">
                                                            [[${@commonUtil.formatPrice(p.price)}]]đ
                                                        </div>
                                                    </th:block>
                                                </div>
                                                <a th:href="@{'/book/'+${p.id}}"
                                                   class="btn btn-primary w-100 btn-view-details">
                                                    <i class="fas fa-eye me-2"></i>View Details
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </th:block>
                            <th:block th:unless="${booksSize>0}">
                                <p class="fs-4 text-center mt-4 text-danger">Book not
                                    available</p>
                            </th:block>
                        </div>

                    </div>
                </div>
                <!-- Start Pagination -->
                <div class="row">
                    <div class="col-md-4">Total Books : [[${totalElements}]]</div>
                    <div class="col-md-6">
                        <th:block th:if="${booksSize>0}">
                            <nav aria-label="Page navigation example">
                                <ul class="pagination">
                                    <li class="page-item"
                                        th:classappend="${isFirst} ? 'disabled':''"><a
                                            class="page-link"
                                            th:href="@{'/books?pageNo='+${pageNo-1}}"
                                            aria-label="Previous"> <span aria-hidden="true">&laquo;</span>
                                    </a></li>

                                    <li th:each="i:${#numbers.sequence(1,totalPages)}"
                                        class="page-item" th:classappend="${pageNo+1==i}?'active':''"
                                        ]]><a class="page-link"
                                              th:href="@{'/books?pageNo='+${i-1}}">[[${i}]]</a></li>

                                    <li class="page-item"
                                        th:classappend="${isLast} ? 'disabled':''"><a
                                            class="page-link"
                                            th:href="@{'/books?pageNo='+${pageNo+1}}"
                                            aria-label="Next"> <span aria-hidden="true">&raquo;</span>
                                    </a></li>
                                </ul>
                            </nav>
                        </th:block>
                    </div>
                </div>

            </div>
        </div>
    </div>

</section>
</body>
</html>
