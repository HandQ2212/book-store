<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
</head>
<body>
<section>
    <!-- Search Section -->
    <div class="search-section mt-5">
        <div class="container">
            <form action="/books" method="get">
                <div class="input-group">
                    <input type="text" class="form-control" name="ch" placeholder="Search books by title...">
                    <button class="btn btn-primary" type="submit">
                        <i class="fa-solid fa-magnifying-glass"></i> Search
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Books Section -->
    <div class="container mt-4 mb-5">
        <div class="row g-3">
            <!-- Sidebar - Categories -->
            <div class="col-lg-2">
                <div class="sidebar">
                    <h5 class="sidebar-title">Categories</h5>
                    <div class="list-group list-group-flush">
                        <a href="/books"
                           th:classappend="${paramValue==''} ? 'list-group-item list-group-item-action active':'list-group-item list-group-item-action'">
                            <i class="fa-solid fa-check"></i> All Books
                        </a>
                        <a th:each="c:${categories}"
                           th:href="@{'/books?category='+${c.name}}"
                           th:classappend="${paramValue == c.name} ? 'list-group-item list-group-item-action active':'list-group-item list-group-item-action'"
                           th:text="${c.name}">
                        </a>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-lg-10">
                <div class="card">
                    <div class="card-body">
                        <!-- Books Grid -->
                        <th:block th:if="${booksSize > 0}">
                            <div class="book-grid">
                                <div class="book-card" th:each="p:${books}">
                                    <img th:src="@{'/img/book_img/'+${p.image}}" th:alt="${p.title}" class="book-card-img">
                                    <div class="book-card-body">
                                        <p class="book-card-title" th:text="${p.title}"></p>
                                        <div class="book-card-price">
                                            <span class="book-card-price-current"><th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block> [[${p.discountPrice}]]</span>
                                            <span class="book-card-price-original"><th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block> [[${p.price}]]</span>
                                        </div>
                                        <span class="book-card-discount">[[${p.discount}]]% OFF</span>
                                        <div class="book-card-action">
                                            <a th:href="@{'/book/'+${p.id}}" class="btn btn-primary">View Details</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </th:block>

                        <!-- No Books Message -->
                        <th:block th:unless="${booksSize > 0}">
                            <div class="alert alert-info text-center py-4" role="alert">
                                <i class="fa-solid fa-info-circle fa-2x mb-2 d-block"></i>
                                <h5>No Books Available</h5>
                                <p class="text-muted mb-0">Try searching with different keywords or explore our categories.</p>
                            </div>
                        </th:block>
                    </div>
                </div>

                <!-- Pagination -->
                <th:block th:if="${booksSize > 0}">
                    <div class="row mt-4">
                        <div class="col-md-4">
                            <p class="text-muted"><strong>[[${totalElements}]]</strong> book(s) found</p>
                        </div>
                        <div class="col-md-8 text-end">
                            <nav aria-label="Page navigation">
                                <ul class="pagination justify-content-end">
                                    <li class="page-item" th:classappend="${isFirst} ? 'disabled':''">
                                        <a class="page-link" th:href="@{'/books?pageNo='+${pageNo-1}}" aria-label="Previous">
                                            <span aria-hidden="true">&laquo;</span> Previous
                                        </a>
                                    </li>
                                    <li th:each="i:${#numbers.sequence(1,totalPages)}" class="page-item" th:classappend="${pageNo+1==i}?'active':''">
                                        <a class="page-link" th:href="@{'/books?pageNo='+${i-1}}">[[${i}]]</a>
                                    </li>
                                    <li class="page-item" th:classappend="${isLast} ? 'disabled':''">
                                        <a class="page-link" th:href="@{'/books?pageNo='+${pageNo+1}}" aria-label="Next">
                                            Next <span aria-hidden="true">&raquo;</span>
                                        </a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </th:block>
            </div>
        </div>
    </div>

</section>
</body>
</html>
