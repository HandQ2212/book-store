<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Book Store</title>
</head>
<body>
<section>
    <div class="container mt-5 p-5">
        <div class="row">
            <div class="col-md-6 p-5 d-none d-md-block">
                <img alt="Forgot Password" src="img/bs.png" width="100%" height="400px" class="rounded">
            </div>
            <div class="col-md-6 mt-3 p-5">
                <div class="card shadow p-4 rounded" style="border: none;">
                    <div class="card-header" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); color: white; border-radius: 8px; margin: -16px -16px 16px -16px;">
                        <p class="fs-4 text-center mb-0"><i class="fas fa-key"></i> Recover Your Account</p>
                    </div>

                    <th:block th:if="${session.succMsg}">
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="fas fa-check-circle"></i> [[${session.succMsg}]]
                            <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                        </div>
                    </th:block>

                    <th:block th:if="${session.errorMsg}">
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-circle"></i> [[${session.errorMsg}]]
                            <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                        </div>
                    </th:block>

                    <div class="card-body">
                        <p class="text-muted mb-4">Enter your email address and we'll send you a link to reset your password.</p>
                        <form action="/forgot-password" method="post">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-envelope"></i> Email Address</label>
                                <input required class="form-control" name="email" type="email" placeholder="your@email.com">
                            </div>
                            <button type="submit" class="btn btn-primary col-md-12 fw-bold">
                                <i class="fas fa-paper-plane"></i> Send Recovery Link
                            </button>
                        </form>
                    </div>
                    <div class="card-footer text-center" style="background-color: #f9fafb;">
                        Remember your password? <a href="/signin" class="text-decoration-none fw-bold text-primary">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
