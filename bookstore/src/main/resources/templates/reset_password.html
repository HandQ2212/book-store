<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - Book Store</title>
</head>
<body>
<section>
    <div class="container mt-5 p-5">
        <div class="row">
            <div class="col-md-6 p-5 d-none d-md-block">
                <img alt="Reset Password" src="img/ecom.png" width="100%" height="400px" class="rounded">
            </div>
            <div class="col-md-6 mt-3 p-5">
                <div class="card shadow p-4 rounded" style="border-top: 4px solid #2563eb;">
                    <div class="card-header" style="background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; border-radius: 8px; margin: -16px -16px 16px -16px;">
                        <p class="fs-4 text-center mb-0"><i class="fas fa-lock"></i> Set New Password</p>
                    </div>

                    <th:block th:if="${session.succMsg}">
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="fas fa-check-circle"></i> [[${session.succMsg}]]
                            <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                        </div>
                    </th:block>

                    <th:block th:if="${session.errorMsg}">
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-circle"></i> [[${session.errorMsg}]]
                            <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                        </div>
                    </th:block>

                    <div class="card-body">
                        <form action="/reset-password" method="post" id="resetPassword" novalidate>
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-lock"></i> New Password</label>
                                <input id="pass" class="form-control" name="password" type="password" placeholder="Min. 6 characters">
                            </div>

                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-check-circle"></i> Confirm Password</label>
                                <input name="confirmPassword" class="form-control" type="password" placeholder="Repeat password">
                            </div>
                            <input type="hidden" th:value="${token}" name="token">
                            <button type="submit" class="btn btn-primary col-md-12 fw-bold">
                                <i class="fas fa-check"></i> Reset Password
                            </button>
                        </form>
                    </div>
                    <div class="card-footer text-center" style="background-color: #f9fafb;">
                        <a href="/login" class="text-decoration-none fw-bold text-primary">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
