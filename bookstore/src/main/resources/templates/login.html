<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
</head>
<body>
<section>
    <div class="container mt-5">
        <div class="row g-0 align-items-center" style="min-height: 80vh;">
            <div class="col-md-6 d-none d-md-block">
                <img alt="bookstore" src="/img/ecom.png" class="w-100 h-100" style="object-fit: cover; border-radius: 12px 0 0 12px;" loading="eager">
            </div>
            <div class="col-md-6 p-5">
                <div class="card shadow-lg">
                    <div class="card-header text-center">
                        <h2 class="mb-0" style="color: #fff;">Welcome Back</h2>
                        <p class="small mt-2" style="color: rgba(255,255,255,0.8);">Sign in to your account</p>
                    </div>
                    <div th:if="${param.error}" class="alert alert-danger m-3" role="alert">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <th:block th:if="${session.SPRING_SECURITY_LAST_EXCEPTION!=null}">
                            [[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]
                        </th:block>
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success m-3" role="alert">
                        <i class="fa-solid fa-check-circle"></i> Logged out successfully.
                    </div>
                    <div class="card-body">
                        <form action="/login" method="post" novalidate accept-charset="UTF-8">
                            <div class="mb-3">
                                <label class="form-label" for="email">Email Address</label>
                                <input required id="email" class="form-control" name="username" type="email" placeholder="Enter your email">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="password">Password</label>
                                <input required id="password" class="form-control" name="password" type="password" placeholder="Enter your password">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <p class="mb-2"><a href="/forgot-password" class="text-decoration-none"><i class="fa-solid fa-key"></i> Forgot Password?</a></p>
                        <p class="text-muted">Don't have an account? <a href="/register" class="fw-600">Create one</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</section>
</body>
</html>
