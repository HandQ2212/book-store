<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Register - Book Store</title>
</head>
<body>
<section>
    <div class="container mt-5 p-5">
        <div class="row">
            <div class="col-md-5 p-5">
                <img alt="" src="img/bs.png" width="100%" height="400px">
            </div>
            <div class="col-md-7 p-2">
                <div class="card shadow p-3 mb-5 rounded" style="border: none;">
                    <div class="card-header text-center" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); color: white; border-radius: 12px 12px 0 0;">
                        <p class="fs-4 text-center mb-0" style="color: white;"><i class="fas fa-user-plus"></i> Create Account</p>
                        <th:block th:if="${session.succMsg}">
                            <div class="alert alert-success alert-dismissible fade show mt-2" role="alert">
                                <i class="fas fa-check-circle"></i> [[${session.succMsg}]]
                                <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                            </div>
                        </th:block>

                        <th:block th:if="${session.errorMsg}">
                            <div class="alert alert-danger alert-dismissible fade show mt-2" role="alert">
                                <i class="fas fa-exclamation-circle"></i> [[${session.errorMsg}]]
                                <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                            </div>
                        </th:block>
                    </div>
                    <div class="card-body">
                        <form action="/saveUser" enctype="multipart/form-data" id="userRegister" novalidate
                              method="post">
                            <div class="row">
                                <div class="col">
                                    <label class="form-label"><i class="fas fa-user"></i> Name</label>
                                    <input required class="form-control" name="name" type="text" placeholder="Nguyễn Văn A">
                                </div>
                                <div class="col">
                                    <label class="form-label"><i class="fas fa-phone"></i> Mobile Number</label>
                                    <input required class="form-control" name="mobileNumber" type="number" placeholder="+84...">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
                                <input required class="form-control" name="email" type="email" placeholder="your@email.com">
                            </div>


                            <div class="row">
                                <div class="col">
                                    <label class="form-label"><i class="fas fa-map-marker-alt"></i> Address</label>
                                    <input required class="form-control" name="address" type="text" placeholder="Số nhà, tên đường...">
                                </div>
                                <div class="col">
                                    <label class="form-label"><i class="fas fa-city"></i> City</label>
                                    <input required class="form-control" name="city" type="text" placeholder="Hà Nội, TP.HCM, Đà Nẵng...">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col">
                                    <label class="form-label"><i class="fas fa-map"></i> Country</label>
                                    <input required class="form-control" name="state" type="text" placeholder="Việt Nam,...">
                                </div>
                                <div class="col">
                                    <label class="form-label"><i class="fas fa-mailbox"></i> Pincode</label>
                                    <input required class="form-control" name="pincode" type="text" placeholder="Nhập mã bưu điện">
                                </div>
                            </div>


                            <div class="row">
                                <div class="col">
                                    <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                                    <input required class="form-control" name="password" type="password" id="pass" placeholder="Ít nhất 6 chữ cái">
                                </div>
                                <div class="col">
                                    <label class="form-label"><i class="fas fa-check-circle"></i> Confirm Password</label>
                                    <input required class="form-control" name="confirmpassword" type="password" placeholder="Nhắc lại mật khẩu">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-image"></i> Profile Image</label>
                                <input class="form-control" name="img" type="file" accept="image/*">
                            </div>






                            <button type="submit" class="btn btn-primary col-md-12 fw-bold"><i class="fas fa-user-check"></i> Register Now</button>
                        </form>
                    </div>

                    <div class="card-footer text-center" style="background-color: #f8f9fa; border-radius: 0 0 12px 12px;">
                        Already have an account? <a href="/signin" class="text-decoration-none fw-bold" style="color: var(--secondary-color);">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</section>
</body>
</html>
