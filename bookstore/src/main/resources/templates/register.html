<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
</head>
<body>
<section>
    <div class="container mt-5">
        <div class="row g-0 align-items-center">
            <div class="col-md-5 d-none d-md-block">
                <img alt="bookstore" src="/img/ecom.png" class="w-100 h-100" style="object-fit: cover; border-radius: 12px 0 0 12px;" loading="eager">
            </div>
            <div class="col-md-7 p-4">
                <div class="card shadow-lg">
                    <div class="card-header text-center">
                        <h2 class="mb-0" style="color: #fff;">Create Account</h2>
                        <p class="small mt-2" style="color: rgba(255,255,255,0.8);">Join us today</p>
                    </div>
                    <th:block th:if="${session.succMsg}">
                        <div class="alert alert-success m-3" role="alert">
                            <i class="fa-solid fa-check-circle"></i> [[${session.succMsg}]]
                        </div>
                        <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                    </th:block>
                    <th:block th:if="${session.errorMsg}">
                        <div class="alert alert-danger m-3" role="alert">
                            <i class="fa-solid fa-circle-exclamation"></i> [[${session.errorMsg}]]
                        </div>
                        <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                    </th:block>
                    <div class="card-body">
                        <form action="/saveUser" enctype="multipart/form-data" id="userRegister" novalidate
                              method="post" accept-charset="UTF-8">
                            <div class="row">
                                <div class="col mb-3">
                                    <label class="form-label">Full Name *</label>
                                    <input required class="form-control" name="name" type="text" placeholder="Your full name">
                                </div>
                                <div class="col mb-3">
                                    <label class="form-label">Mobile Number *</label>
                                    <input required class="form-control" name="mobileNumber" type="number" placeholder="10-digit mobile">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email *</label>
                                <input required class="form-control" name="email" type="email" placeholder="your@email.com">
                            </div>


                            <div class="row">
                                <div class="col mb-3">
                                    <label class="form-label">Address *</label>
                                    <input required class="form-control" name="address" type="text" placeholder="Street address">
                                </div>
                                <div class="col mb-3">
                                    <label class="form-label">City *</label>
                                    <input required class="form-control" name="city" type="text" placeholder="City">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col mb-3">
                                    <label class="form-label">State *</label>
                                    <input required class="form-control" name="state" type="text" placeholder="State">
                                </div>
                                <div class="col mb-3">
                                    <label class="form-label">Pincode *</label>
                                    <input required class="form-control" name="pincode" type="number" placeholder="Postal code">
                                </div>
                            </div>


                            <div class="row">
                                <div class="col mb-3">
                                    <label class="form-label">Password *</label>
                                    <input required class="form-control" name="password" type="password" id="pass" placeholder="Min 6 characters">
                                </div>
                                <div class="col mb-3">
                                    <label class="form-label">Confirm Password *</label>
                                    <input required class="form-control" name="confirmpassword" type="password" placeholder="Confirm password">
                                </div>
                            </div>



                            <div class="mb-3">
                                <label class="form-label">Profile Picture</label>
                                <input class="form-control" name="img" type="file" accept="image/*">
                                <small class="text-muted">Optional. Max 2MB.</small>
                            </div>






                            <button type="submit" class="btn btn-primary w-100 mb-3">Create Account</button>
                        </form>
                    </div>

                    <div class="card-footer text-center">
                        <p class="text-muted">Already have an account? <a href="/login" class="fw-600">Sign In</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</section>
</body>
</html>
