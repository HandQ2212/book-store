<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Bookstore - Home</title>
</head>
<body>
<section>
    <!-- Start Slider  -->
    <div id="carouselExample" class="carousel slide carousel-fade mt-5 container-fluid">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="/img/ecom1.jpg" class="d-block w-100" alt="slider-1" height="400px" loading="eager">
            </div>
            <div class="carousel-item">
                <img src="/img/ecom3.jpg" class="d-block w-100" alt="slider-2" height="400px" loading="eager">
            </div>
            <div class="carousel-item">
                <img src="/img/ecom2.png" class="d-block w-100" alt="slider-3" height="400px" loading="eager">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    <!-- End Slider  -->

    <!-- Start Category Module -->
    <div class="container mt-5 mb-5">
        <div class="section-header">
            <h2><i class="fa-solid fa-list"></i> Categories</h2>
        </div>
        <div class="category-grid">
            <div class="category-card" th:each="c:${category}">
                <img th:src="${@commonUtil.getImageUrl(c.imageName)}" th:alt="${c.name}" loading="eager">
                <p th:text="${c.name}"></p>
                <a th:href="@{'/books?category='+${c.name}}">Browse</a>
            </div>
        </div>
    </div>
    <!-- End Category Module -->

    <!-- Start Latest Book Module -->
    <div class="p-container" style="background-color: var(--light-bg);">
        <div class="container">
            <div class="section-header">
                <h2><i class="fa-solid fa-star"></i> Latest Books</h2>
            </div>
            <div class="book-grid">
                <div class="book-card" th:each="p:${books}">
                    <img th:src="${@commonUtil.getImageUrl(p.image)}" th:alt="${p.title}" class="book-card-img" loading="eager">
                    <div class="book-card-body">
                        <h5 class="book-card-title" th:text="${p.title}"></h5>
                        <div class="book-card-price">
                            <span class="book-card-price-current">[[${#numbers.formatInteger(p.discountPrice,0)}]]đ</span>
                            <span class="book-card-price-original">[[${#numbers.formatInteger(p.price,0)}]]đ</span>
                        </div>
                        <span class="book-card-discount">[[${p.discount}]]% OFF</span>
                        <div class="book-card-action">
                            <a th:href="@{'/book/'+${p.id}}" class="btn btn-primary">View Details</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- End Latest Book Module -->
</section>
</body>
</html>
