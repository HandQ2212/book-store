<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
</head>
<body>
<section>
    <!-- Start Slider  -->
    <div class="container-fluid p-0 mt-5">
        <div id="carouselExample" class="carousel slide carousel-fade">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="/img/ecom1.png" class="d-block w-100" alt="slider-1" loading="eager">
                </div>
                <div class="carousel-item">
                    <img src="/img/ecom3.jpg" class="d-block w-100" alt="slider-2" loading="eager">
                </div>
                <div class="carousel-item">
                    <img src="/img/ecom2.jpg" class="d-block w-100" alt="slider-3" loading="eager">
                </div>
            </div>
            <button class="carousel-control-prev" type="button"
                    data-bs-target="#carouselExample" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button"
                    data-bs-target="#carouselExample" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>
    <!-- End Slider  -->

    <!-- Start Category Module -->
    <div class="container p-container">
        <div class="section-header">
            <h2>Browse Categories</h2>
        </div>
        <div class="category-grid">
            <div class="category-card" th:each="c:${category}">
                <img th:src="@{'/img/category_img/'+${c.imageName}}" th:alt="${c.name}" loading="eager">
                <p th:text="${c.name}"></p>
                <a th:href="@{'/books?category='+${c.name}}">Explore</a>
            </div>
        </div>
    </div>
    <!-- End Category Module -->


    <!-- Start Latest Book Module -->
    <div class="container-fluid p-container" style="background-color: var(--light-bg);">
        <div class="container">
            <div class="section-header">
                <h2>Latest Books</h2>
            </div>
            <div class="book-grid">
                <div class="book-card" th:each="p:${books}">
                    <img th:src="@{'/img/book_img/'+${p.image}}" th:alt="${p.title}" class="book-card-img">
                    <div class="book-card-body">
                        <p class="book-card-title" th:text="${p.title}"></p>
                        <div class="book-card-price">
                            <span class="book-card-price-current"><th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block> [[${p.discountPrice}]]</span>
                            <span class="book-card-price-original"><th:block th:utext="${@commonServiceImpl.rupeeSign()}"></th:block> [[${p.price}]]</span>
                        </div>
                        <span class="book-card-discount">[[${p.discount}]]% OFF</span>
                        <div class="book-card-action">
                            <a th:href="@{'/book/'+${p.id}}" class="btn btn-primary">View Details</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- End Latest Book Module -->
</section>
</body>
</html>
