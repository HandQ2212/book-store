<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Bookstore - Home</title>
</head>
<body>
<section>
    <!-- Start Slider  -->
    <div id="carouselExample" class="carousel slide carousel-fade mt-5">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="/img/ecom1.png" class="d-block w-100" alt="slider-1" height="350px" loading="eager">
            </div>
            <div class="carousel-item">
                <img src="/img/ecom3.jpg" class="d-block w-100" alt="slider-2" height="350px" loading="eager">
            </div>
            <div class="carousel-item">
                <img src="/img/ecom2.jpg" class="d-block w-100" alt="slider-3" height="350px" loading="eager">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    <!-- End Slider  -->

    <!-- Start Category Module -->
    <div class="container mt-5 mb-5">
        <div class="row">
            <div class="col-12">
                <h2 class="text-center mb-4">Categories</h2>
            </div>
            <div class="col-md-2" th:each="c:${category}">
                <div class="card card-sh text-center">
                    <div class="card-body">
                        <img th:src="@{'/img/category_img/'+${c.imageName}}" th:alt="${c.name}" width="100%" height="140px" loading="eager" style="object-fit: cover;">
                        <p class="mt-3 mb-0">
                            <a th:href="@{'/books?category='+${c.name}}" class="text-decoration-none fw-bold" th:text="${c.name}"></a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- End Category Module -->

    <!-- Start Latest Book Module -->
    <div class="bg-light py-5">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <h2 class="text-center mb-4">Latest Books</h2>
                </div>
                <div class="col-md-3 mb-4" th:each="p:${books}">
                    <div class="card card-sh h-100">
                        <div class="card-body text-center">
                            <img th:src="@{'/img/book_img/'+${p.image}}" th:alt="${p.title}" width="100%" height="180px" style="object-fit: cover; border-radius: 8px;">
                            <p class="mt-3 mb-0">
                                <a th:href="@{'/book/'+${p.id}}" class="text-decoration-none text-dark fw-bold" th:text="${p.title}"></a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- End Latest Book Module -->
</section>
</body>
</html>
